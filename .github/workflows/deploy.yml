name: Deploy FileBot to VPS (Git Clone)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'

env:
  PROJECT_DIR: /opt/filebot
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  BRANCH: ${{ github.event.inputs.branch || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: Add VPS and GitHub to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      
      - name: Deploy to VPS via Git Clone
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          
          # Configuration
          PROJECT_DIR="/opt/filebot"
          BRANCH="${{ env.BRANCH }}"
          REPO_URL="${{ env.REPO_URL }}"
          
          echo "🚀 Starting deployment..."
          echo "📦 Project: $REPO_URL"
          echo "🌿 Branch: $BRANCH"
          
          # Stop service
          if systemctl is-active --quiet filebot; then
            echo "⏹️  Stopping FileBot service..."
            systemctl stop filebot
          fi
          
          # Backup existing installation
          if [ -d "$PROJECT_DIR" ]; then
            echo "💾 Creating backup..."
            BACKUP_DIR="${PROJECT_DIR}_backup_$(date +%Y%m%d_%H%M%S)"
            cp -r "$PROJECT_DIR" "$BACKUP_DIR"
            echo "Backup saved to: $BACKUP_DIR"
            
            # Keep only last 3 backups
            ls -dt ${PROJECT_DIR}_backup_* | tail -n +4 | xargs -r rm -rf
          fi
          
          # Clone or pull repository
          if [ -d "$PROJECT_DIR/.git" ]; then
            echo "📥 Pulling latest changes..."
            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard origin/$BRANCH
          else
            echo "📥 Cloning repository..."
            rm -rf "$PROJECT_DIR"
            git clone --branch $BRANCH --single-branch $REPO_URL "$PROJECT_DIR"
          fi
          
          cd "$PROJECT_DIR"
          
          # Install system dependencies
          echo "📦 Installing system dependencies..."
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv p7zip-full aria2
          
          # Setup virtual environment
          echo "🐍 Setting up Python environment..."
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Create .env file
          echo "⚙️  Creating .env configuration..."
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          API_BASE_FILE_URL=${{ secrets.API_BASE_FILE_URL }}
          HOST_BASE_URL=${{ secrets.HOST_BASE_URL }}
          HOST_PORT=${{ secrets.HOST_PORT }}
          STORE_TIME_HOURS=${{ secrets.STORE_TIME_HOURS }}
          MAX_TELEGRAM_SIZE_MB=${{ secrets.MAX_TELEGRAM_SIZE_MB }}
          DOWNLOAD_METHOD=${{ secrets.DOWNLOAD_METHOD }}
          ARIA2_RPC_URL=${{ secrets.ARIA2_RPC_URL }}
          ARIA2_SECRET=${{ secrets.ARIA2_SECRET }}
          WHITELIST=${{ secrets.WHITELIST }}
          ADMIN_IDS=${{ secrets.ADMIN_IDS }}
          EOF
          
          chmod 600 .env
          
          # Create directories
          mkdir -p data/hosted_files
          mkdir -p /var/log/filebot
          
          # Setup systemd service
          echo "🔧 Setting up systemd service..."
          cat > /etc/systemd/system/filebot.service << EOF
          [Unit]
          Description=FileBot Telegram Bot
          After=network.target
          
          [Service]
          Type=simple
          WorkingDirectory=$PROJECT_DIR
          ExecStart=$PROJECT_DIR/venv/bin/python $PROJECT_DIR/bot.py
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/filebot/bot.log
          StandardError=append:/var/log/filebot/bot_error.log
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          systemctl daemon-reload
          systemctl enable filebot
          
          # Configure firewall
          echo "🔥 Configuring firewall..."
          if command -v ufw &> /dev/null; then
            ufw allow ssh
            if [ -n "${{ secrets.HOST_PORT }}" ]; then
              ufw allow ${{ secrets.HOST_PORT }}/tcp
            fi
            if ! ufw status | grep -q "Status: active"; then
              ufw --force enable
            fi
          fi
          
          # Start service
          echo "▶️  Starting FileBot service..."
          systemctl start filebot
          
          # Check status
          sleep 5
          if systemctl is-active --quiet filebot; then
            echo "✅ FileBot is running!"
          else
            echo "❌ FileBot failed to start"
            journalctl -u filebot -n 20 --no-pager
            exit 1
          fi
          
          # Health check
          if [ -n "${{ secrets.HOST_BASE_URL }}" ]; then
            sleep 3
            if curl -sf ${{ secrets.HOST_BASE_URL }}/health > /dev/null 2>&1; then
              echo "✅ Web server is healthy"
            else
              echo "⚠️  Web server health check failed"
            fi
          fi
          
          echo "🎉 Deployment completed!"
          
          ENDSSH
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      
      - name: Notify success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ✅ **FileBot Deployed Successfully!**
            
            🌿 Branch: `${{ env.BRANCH }}`
            📝 Commit: `${{ github.sha }}`
            👤 Author: ${{ github.actor }}
            
            🖥️ Server: ${{ secrets.VPS_HOST }}
      
      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ❌ **FileBot Deployment Failed!**
            
            🌿 Branch: `${{ env.BRANCH }}`
            📝 Commit: `${{ github.sha }}`
            
            🔗 [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})