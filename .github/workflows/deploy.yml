name: Deploy FileBot to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'

env:
  PROJECT_DIR: /opt/filebot
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='venv' \
            --exclude='data/hosted_files/*' \
            --exclude='*.log' \
            --exclude='.env' \
            .
      
      - name: Copy files to VPS
        run: |
          scp deploy.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy.tar.gz
          scp deploy.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy.sh
      
      - name: Run deployment script
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "bash /tmp/deploy.sh"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_BASE_FILE_URL: ${{ secrets.API_BASE_FILE_URL }}
          HOST_BASE_URL: ${{ secrets.HOST_BASE_URL }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          STORE_TIME_HOURS: ${{ secrets.STORE_TIME_HOURS }}
          MAX_TELEGRAM_SIZE_MB: ${{ secrets.MAX_TELEGRAM_SIZE_MB }}
          DOWNLOAD_METHOD: ${{ secrets.DOWNLOAD_METHOD }}
          ARIA2_RPC_URL: ${{ secrets.ARIA2_RPC_URL }}
          ARIA2_SECRET: ${{ secrets.ARIA2_SECRET }}
          WHITELIST: ${{ secrets.WHITELIST }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      
      - name: Verify deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "systemctl status filebot --no-pager || echo 'Service status check failed'"
      
      - name: Cleanup
        if: always()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "rm -f /tmp/deploy.tar.gz /tmp/deploy.sh"

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Check web server
        if: ${{ secrets.HOST_BASE_URL != '' }}
        run: |
          sleep 10
          curl -f ${{ secrets.HOST_BASE_URL }}/health || echo "Health check failed"
      
      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ⚠️ FileBot Deployment Failed!
            
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            Check GitHub Actions for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      
      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ✅ FileBot Deployed Successfully!
            
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: Rollback deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            if [ -d ${{ env.PROJECT_DIR }}/backup ]; then
              echo 'Rolling back to backup...'
              systemctl stop filebot
              rm -rf ${{ env.PROJECT_DIR }}/*
              cp -r ${{ env.PROJECT_DIR }}/backup/* ${{ env.PROJECT_DIR }}/
              systemctl start filebot
              echo 'Rollback complete'
            else
              echo 'No backup found, skipping rollback'
            fi
          "