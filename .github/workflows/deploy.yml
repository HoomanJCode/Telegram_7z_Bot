name: Deploy Telegram7zBot to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'master'

env:
  PROJECT_DIR: /opt/Telegram7zBot
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
  SERVICE_NAME: telegram7zbot

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: 🔗 Add hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      
      - name: 🚀 Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          
          # ======================
          # Configuration
          # ======================
          PROJECT_DIR="${{ env.PROJECT_DIR }}"
          BRANCH="${{ env.BRANCH }}"
          REPO_URL="${{ env.REPO_URL }}"
          SERVICE_NAME="${{ env.SERVICE_NAME }}"
          
          echo "========================================"
          echo "  Telegram7zBot Deployment"
          echo "========================================"
          echo "📦 Project: $REPO_URL"
          echo "🌿 Branch: $BRANCH"
          echo "📁 Directory: $PROJECT_DIR"
          echo "========================================"
          
          # ======================
          # Stop service
          # ======================
          if systemctl is-active --quiet $SERVICE_NAME; then
            echo "⏹️  Stopping $SERVICE_NAME service..."
            systemctl stop $SERVICE_NAME
          fi
          
          # ======================
          # Backup existing
          # ======================
          if [ -d "$PROJECT_DIR" ]; then
            echo "💾 Creating backup..."
            BACKUP_DIR="${PROJECT_DIR}_backup_$(date +%Y%m%d_%H%M%S)"
            cp -r "$PROJECT_DIR" "$BACKUP_DIR"
            echo "   Backup: $BACKUP_DIR"
            
            # Keep only last 3 backups
            ls -dt ${PROJECT_DIR}_backup_* 2>/dev/null | tail -n +4 | xargs -r rm -rf
          fi
          
          # ======================
          # Clone/Pull repository
          # ======================
          if [ -d "$PROJECT_DIR/.git" ]; then
            echo "📥 Pulling latest changes..."
            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard origin/$BRANCH
          else
            echo "📥 Cloning repository..."
            rm -rf "$PROJECT_DIR"
            git clone --branch $BRANCH --single-branch $REPO_URL "$PROJECT_DIR"
          fi
          
          cd "$PROJECT_DIR"
          
          # ======================
          # System dependencies
          # ======================
          echo "📦 Installing system dependencies..."
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip python3-venv p7zip-full aria2 curl
          
          # ======================
          # Python environment
          # ======================
          echo "🐍 Setting up Python environment..."
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip -q
          pip install -r requirements.txt -q
          
          # ======================
          # Configure .env
          # ======================
          echo "⚙️  Configuring environment..."
          cat > .env << EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          API_BASE_FILE_URL=${{ secrets.API_BASE_FILE_URL }}
          HOST_BASE_URL=${{ secrets.HOST_BASE_URL }}
          HOST_PORT=${{ secrets.HOST_PORT }}
          STORE_TIME_HOURS=${{ secrets.STORE_TIME_HOURS }}
          MAX_TELEGRAM_SIZE_MB=${{ secrets.MAX_TELEGRAM_SIZE_MB }}
          DOWNLOAD_METHOD=${{ secrets.DOWNLOAD_METHOD }}
          ARIA2_RPC_URL=${{ secrets.ARIA2_RPC_URL }}
          ARIA2_SECRET=${{ secrets.ARIA2_SECRET }}
          WHITELIST=${{ secrets.WHITELIST }}
          ADMIN_IDS=${{ secrets.ADMIN_IDS }}
          EOF
          
          chmod 600 .env
          
          # ======================
          # Directories
          # ======================
          echo "📁 Creating directories..."
          mkdir -p data/hosted_files
          mkdir -p /var/log/$SERVICE_NAME
          
          # ======================
          # Systemd service
          # ======================
          echo "🔧 Setting up systemd service..."
          cat > /etc/systemd/system/$SERVICE_NAME.service << EOF
          [Unit]
          Description=Telegram7zBot - Telegram Download Manager
          After=network.target
          Wants=network.target
          
          [Service]
          Type=simple
          WorkingDirectory=$PROJECT_DIR
          Environment=PATH=$PROJECT_DIR/venv/bin:/usr/local/bin:/usr/bin:/bin
          ExecStart=$PROJECT_DIR/venv/bin/python $PROJECT_DIR/bot.py
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/$SERVICE_NAME/bot.log
          StandardError=append:/var/log/$SERVICE_NAME/bot_error.log
          
          # Security hardening
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectSystem=strict
          ProtectHome=yes
          ReadWritePaths=$PROJECT_DIR/data /var/log/$SERVICE_NAME
          ReadOnlyPaths=$PROJECT_DIR
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          systemctl daemon-reload
          systemctl enable $SERVICE_NAME
          
          # ======================
          # Firewall
          # ======================
          echo "🔥 Configuring firewall..."
          if command -v ufw &> /dev/null; then
            ufw allow ssh
            if [ -n "${{ secrets.HOST_PORT }}" ]; then
              ufw allow ${{ secrets.HOST_PORT }}/tcp
              echo "   Port ${{ secrets.HOST_PORT }} opened"
            fi
            if ! ufw status | grep -q "Status: active"; then
              ufw --force enable
            fi
          fi
          
          # ======================
          # Start service
          # ======================
          echo "▶️  Starting $SERVICE_NAME..."
          systemctl start $SERVICE_NAME
          
          sleep 5
          
          if systemctl is-active --quiet $SERVICE_NAME; then
            echo "✅ $SERVICE_NAME is running!"
          else
            echo "❌ $SERVICE_NAME failed to start"
            journalctl -u $SERVICE_NAME -n 20 --no-pager
            exit 1
          fi
          
          # Health check
          if [ -n "${{ secrets.HOST_BASE_URL }}" ]; then
            sleep 3
            if curl -sf ${{ secrets.HOST_BASE_URL }}/health > /dev/null 2>&1; then
              echo "✅ Web server healthy"
            else
              echo "⚠️  Web server health check failed"
            fi
          fi
          
          echo ""
          echo "========================================"
          echo "  ✅ Deployment Complete!"
          echo "========================================"
          echo ""
          
          ENDSSH
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      
      - name: ✅ Notify success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ✅ **Telegram7zBot Deployed!**
            
            🌿 Branch: `${{ env.BRANCH }}`
            📝 Commit: `${{ github.sha }}`
            👤 Author: ${{ github.actor }}
            🖥️ Server: ${{ secrets.VPS_HOST }}
      
      - name: ❌ Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            ❌ **Telegram7zBot Deployment Failed!**
            
            🌿 Branch: `${{ env.BRANCH }}`
            📝 Commit: `${{ github.sha }}`
            
            🔗 [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    name: 🏥 Health Check
    
    steps:
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: 🏥 Check service status
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '=== Service Status ==='
            systemctl status ${{ env.SERVICE_NAME }} --no-pager -l || true
            echo ''
            echo '=== Recent Logs ==='
            journalctl -u ${{ env.SERVICE_NAME }} -n 10 --no-pager || true
          "
      
      - name: 🌐 Check web server
        if: ${{ secrets.HOST_BASE_URL != '' }}
        run: |
          sleep 5
          curl -f -s -o /dev/null -w "Health Check: %{http_code}\n" ${{ secrets.HOST_BASE_URL }}/health || echo "Health check failed"

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    name: 🔄 Rollback
    
    steps:
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: 🔄 Execute rollback
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '🔄 Rolling back deployment...'
            
            # Find latest backup
            LATEST_BACKUP=\$(ls -dt ${{ env.PROJECT_DIR }}_backup_* 2>/dev/null | head -1)
            
            if [ -n \"\$LATEST_BACKUP\" ] && [ -d \"\$LATEST_BACKUP\" ]; then
              echo \"Restoring from: \$LATEST_BACKUP\"
              
              systemctl stop ${{ env.SERVICE_NAME }}
              rm -rf ${{ env.PROJECT_DIR }}
              cp -r \"\$LATEST_BACKUP\" ${{ env.PROJECT_DIR }}
              systemctl start ${{ env.SERVICE_NAME }}
              
              echo '✅ Rollback complete'
            else
              echo '❌ No backup found for rollback'
              exit 1
            fi
          "