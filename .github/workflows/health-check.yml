name: Telegram7zBot Health Check

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

env:
  PROJECT_DIR: /opt/Telegram7zBot
  SERVICE_NAME: telegram7zbot

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: 🏥 Health Monitor
    
    steps:
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: 🏥 Check service
        id: check
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          
          SERVICE_NAME="${{ env.SERVICE_NAME }}"
          RESTARTED=false
          
          echo "🔍 Checking $SERVICE_NAME..."
          
          if ! systemctl is-active --quiet $SERVICE_NAME; then
            echo "❌ $SERVICE_NAME is not running!"
            echo "🔄 Attempting restart..."
            systemctl restart $SERVICE_NAME
            sleep 5
            
            if systemctl is-active --quiet $SERVICE_NAME; then
              echo "✅ $SERVICE_NAME restarted successfully"
              RESTARTED=true
            else
              echo "❌ $SERVICE_NAME failed to restart"
              echo "RESTART_FAILED=true" >> /tmp/health_status
              exit 1
            fi
          else
            echo "✅ $SERVICE_NAME is running"
          fi
          
          # Check memory usage
          MEM_USAGE=$(ps -o pid,rss,comm -p $(systemctl show $SERVICE_NAME -p MainPID --value) --no-headers 2>/dev/null | awk '{print $2}')
          if [ -n "$MEM_USAGE" ]; then
            MEM_MB=$((MEM_USAGE / 1024))
            echo "📊 Memory usage: ${MEM_MB}MB"
          fi
          
          # Check disk space
          DISK_USAGE=$(df -h ${{ env.PROJECT_DIR }} | tail -1 | awk '{print $5}')
          echo "💾 Disk usage: $DISK_USAGE"
          
          echo "RESTARTED=$RESTARTED" >> /tmp/health_status
          
          ENDSSH
      
      - name: 🌐 Check web server
        if: ${{ secrets.HOST_BASE_URL != '' }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.HOST_BASE_URL }}/health || echo "000")
          echo "Web server status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Web server not responding properly"
            exit 1
          fi
      
      - name: 🚨 Notify on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            🚨 **Telegram7zBot Health Alert!**
            
            The service may be experiencing issues.
            
            🖥️ Server: ${{ secrets.VPS_HOST }}
            ⏰ Time: $(date)
            
            **Action Required:** Check the server immediately.
            
            ```bash
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
            systemctl status telegram7zbot
            journalctl -u telegram7zbot -n 50