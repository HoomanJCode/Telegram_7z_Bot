name: Telegram7zBot Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  PROJECT_DIR: /opt/Telegram7zBot
  SERVICE_NAME: telegram7zbot

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: 🏥 Health Monitor
    
    steps:
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      
      - name: 🏥 Check service
        id: check
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'ENDSSH'
          
          SERVICE_NAME="${{ env.SERVICE_NAME }}"
          
          echo "🔍 Checking $SERVICE_NAME..."
          
          if ! systemctl is-active --quiet $SERVICE_NAME; then
            echo "❌ $SERVICE_NAME is not running!"
            echo "🔄 Attempting restart..."
            systemctl restart $SERVICE_NAME
            sleep 5
            
            if systemctl is-active --quiet $SERVICE_NAME; then
              echo "✅ $SERVICE_NAME restarted successfully"
            else
              echo "❌ $SERVICE_NAME failed to restart"
              exit 1
            fi
          else
            echo "✅ $SERVICE_NAME is running"
          fi
          
          # Memory usage
          PID=$(systemctl show $SERVICE_NAME -p MainPID --value 2>/dev/null)
          if [ -n "$PID" ] && [ "$PID" != "0" ]; then
            MEM=$(ps -o rss= -p $PID 2>/dev/null)
            if [ -n "$MEM" ]; then
              echo "📊 Memory: $((MEM / 1024))MB"
            fi
          fi
          
          # Disk usage
          echo "💾 Disk: $(df -h ${{ env.PROJECT_DIR }} | tail -1 | awk '{print $5}')"
          
          ENDSSH
      
      - name: 🚨 Notify on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            🚨 **Telegram7zBot Health Alert!**
            
            Service may be down!
            
            🖥️ Server: ${{ secrets.VPS_HOST }}
            ⏰ Time: $(date)
            
            SSH: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}