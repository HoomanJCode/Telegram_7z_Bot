name: Release & Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  # ──────────────────────────────────────────────
  # 1. Run tests (reusable workflow)
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Test
    uses: ./.github/workflows/tests.yml

  # ──────────────────────────────────────────────
  # 2. Build and push Docker image to GHCR (reusable workflow)
  # ──────────────────────────────────────────────
  docker:
    name: 🐳 Build Docker Image
    needs: test
    # The calling job must grant the permissions the nested workflow
    # requests; reusable workflows can never exceed the caller's grant.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml

  # ──────────────────────────────────────────────
  # 3. Create GitHub Release with changelog
  # ──────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    name: 📝 Create Release
    needs: docker
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -A1 "^${TAG}$" | tail -1)

          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG")
            {
              echo "body<<EOF"
              echo "## What's Changed"
              echo ""
              echo "$LOG"
              echo ""
              echo "## Docker"
              echo ""
              echo "\`\`\`bash"
              echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${TAG}"
              echo "\`\`\`"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────
  # 4. Deploy to VPS (reusable workflow; skipped without VPS secrets)
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
